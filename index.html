<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kő - Papír - Olló</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="kontener">
        <h1>Kő - Papír - Olló</h1>
        <h2>Válassz!</h2>

        <div class="kepek">
            <img src="img/ko.png" alt="kep a kőről" class="kivalasztva" onclick="jatek('ko')">
            <img src="img/papir.png" alt="kep a papírról" onclick="jatek('papir')">
            <img src="img/ollo.png" alt="kep az ollóról" onclick="jatek('ollo')">
        </div>

        <h2>Gép választása</h2>

        <div >
            <img id="eredmenykep" src="img/ollo.png" alt="">
        </div>


        <h1>Eredmény: Te nyertél!</h1>
        
        <h3>Te pontod</h3>
        <p>2</p>

        <h3>Gép pontja</h3>
        <p>8</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
